<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <!-- 电路板 -->
  <rect x="40" y="20" width="240" height="200" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- 芯片 -->
  <rect x="120" y="70" width="80" height="80" rx="4" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <rect x="140" y="85" width="40" height="50" rx="2" fill="#3b82f6" opacity="0.3"/>
  <!-- 引脚 -->
  <g stroke="#60a5fa" stroke-width="2" stroke-linecap="round">
    <line x1="70" y1="90" x2="120" y2="90"/>
    <line x1="70" y1="110" x2="120" y2="110"/>
    <line x1="70" y1="130" x2="120" y2="130"/>
    <line x1="200" y1="90" x2="250" y2="90"/>
    <line x1="200" y1="110" x2="250" y2="110"/>
    <line x1="200" y1="130" x2="250" y2="130"/>
  </g>
  <!-- USB-C 口 -->
  <rect x="60" y="50" width="30" height="16" rx="3" fill="#334155" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="230" y="50" width="30" height="16" rx="3" fill="#334155" stroke="#60a5fa" stroke-width="1.5"/>
  <!-- HID 标志 -->
  <text x="160" y="185" font-size="12" font-family="monospace" fill="#94a3b8" text-anchor="middle">HID MAPPER</text>
  <!-- 连接线 -->
  <path d="M60 58 Q20 58 20 110 Q20 162 60 162" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M260 58 Q300 58 300 110 Q300 162 260 162" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
</svg>
